name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install PySide6 PyMuPDF Pillow pyinstaller

      - name: Build EXE
        run: python -m PyInstaller "拼版选图导出工作台.spec" --clean --noconfirm

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "from config import APP_VERSION; print(APP_VERSION)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 拼版选图导出工作台_v${{ steps.version.outputs.version }}
          path: dist/*.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 拼版选图导出工作台 v${{ steps.version.outputs.version }}
          files: dist/*.exe
          generate_release_notes: true
